name: Docs

# The docs site (docs/, an mdBook): built and its links checked on every change to it, in under a
# minute and without a Rust build (the generated reference pages are committed; CI's `test` job
# checks they're current). ci.yml skips pushes that change only `.md` files, so this is where
# prose gets checked. The same check runs locally: bash scripts/dev/docs-check.sh (check.sh runs
# it too when the tools are installed).
#
#   - every push and pull request touching the docs: build, then every link inside the site,
#     offline (pages, files, #anchors). A broken one fails the run. Then the site as published
#     (docs-site.sh: mdBook's search off, Pagefind's on) and both searches in a browser
#     (docs-search-check.cjs: Pagefind on the site over HTTP, mdBook's on the offline pages from
#     file://, which is what the release's docs zip holds).
#   - weekly, and by hand (gh workflow run docs.yml -f network=true): also the links to other
#     sites. Reports in the run's summary, never fails it: other people's sites go down.
#   - publishing to GitHub Pages: on a release tag (v*), and by hand from the `docs-0.6` branch
#     (fixes between releases, cherry-picked there: decisions.md "0.6.8 answers", Q2). OFF until
#     Todd turns it on, see the `pages` job.
on:
  push:
    branches: [main, "docs-*"]
    tags: ["v*"]
    paths:
      - "docs/**"
      - "scripts/dev/docs-*"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "scripts/dev/docs-*"
      - ".github/workflows/docs.yml"
  schedule:
    - cron: "41 5 * * 1"
  workflow_dispatch:
    inputs:
      network:
        description: Also check the links to other sites (reports, doesn't fail)
        type: boolean
        default: false
      publish:
        description: Publish the site to GitHub Pages (only from the docs-0.6 branch, and only once Pages is on)
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # mdBook, lychee and Pagefind, pinned by version and checksum (the script says how to bump them).
      - name: Install mdBook, lychee and Pagefind
        run: bash scripts/dev/docs-tools.sh
      - name: Build the book and check its links (offline)
        run: bash scripts/dev/docs-check.sh
      - name: Build the site with Pagefind's search
        run: bash scripts/dev/docs-site.sh
      # playwright-core alone (no browsers downloaded) drives the runner's own Chrome; the version
      # is the web UI's (ui/package-lock.json).
      - name: Check both searches in a browser
        env:
          DOCS_BROWSER: chrome
        run: |
          npm install --no-save --no-audit --no-fund --prefix "$RUNNER_TEMP/pw" playwright-core@1.64.0
          node scripts/dev/docs-search-check.cjs "$RUNNER_TEMP/pw/node_modules/playwright-core"
      # Kept only when the pages job will publish it.
      - if: ${{ vars.DOCS_PAGES == 'on' && (startsWith(github.ref, 'refs/tags/v') || (inputs.publish && github.ref == 'refs/heads/docs-0.6')) }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: target/site

  # Links to other sites: weekly and on demand. continue-on-error keeps a dead outside link from
  # failing the run; what's broken is in the run's summary (and the step shows as failed).
  links-online:
    if: ${{ github.event_name == 'schedule' || inputs.network }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Install mdBook, lychee and Pagefind
        run: bash scripts/dev/docs-tools.sh
      - name: Check every link, other sites included
        continue-on-error: true
        env:
          # lychee asks GitHub's API with it when it can: fewer rate-limited answers from github.com.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/dev/docs-check.sh --network --format markdown --output "$GITHUB_STEP_SUMMARY"

  # Publishing to docs.getductus.com. OFF: it runs only when the repository variable DOCS_PAGES is
  # `on`, and nothing sets it yet. Before turning it on, Todd (0.6-design.md "0.6.8 detailed
  # design", "What each outward step will need from Todd"):
  #   1. Settings -> Pages -> Source: "GitHub Actions"; Custom domain: docs.getductus.com;
  #      "Enforce HTTPS" once GitHub has the certificate.
  #   2. DNS at Hostinger: `docs` CNAME `thorst.github.io` (nothing else changes).
  #   3. Settings -> Environments -> github-pages -> Deployment branches and tags: add the tag rule
  #      `v*` and the branch `docs-0.6` (GitHub allows only the default branch at first, and this
  #      job never publishes main: main describes unreleased behaviour).
  #   4. gh variable set DOCS_PAGES --body on -R thorst/ductus
  # Then a v* tag publishes that release's docs; fixes between releases go to the docs-0.6 branch
  # and are published with: gh workflow run docs.yml --ref docs-0.6 -f publish=true
  pages:
    needs: build
    if: ${{ vars.DOCS_PAGES == 'on' && (startsWith(github.ref, 'refs/tags/v') || (inputs.publish && github.ref == 'refs/heads/docs-0.6')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # One publish at a time, and a running one is never cancelled halfway.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
