name: CI

on:
  # Commits that only change prose don't run CI. The exception is docs/schema.md: a store test
  # checks it against the migrations. (Later patterns win, so it is added back after the *.md rule.)
  push:
    branches: [main]
    paths: ["**", "!**/*.md", "docs/schema.md"]
  pull_request:
    paths: ["**", "!**/*.md", "docs/schema.md"]
  # Manual runs can pick the runner image, e.g. to try a new Ubuntu before `ubuntu-latest` moves:
  #   gh workflow run ci.yml -f runner=ubuntu-26.04
  workflow_dispatch:
    inputs:
      runner:
        description: Runner image
        default: ubuntu-latest

# A newer push to the same branch cancels the run for the commit before it (a quick follow-up fix
# then costs one run, not two). Manual runs are never cancelled and don't cancel others.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

env:
  CARGO_TERM_COLOR: always
  # The binary must embed the web UI (without it, build.rs embeds a "build the UI" page).
  DUCTUS_REQUIRE_UI: "1"
  # The packages demo's database container (mirror.yml's copy of the official image).
  POSTGRES_IMAGE: ghcr.io/thorst/ductus-ci-postgres:18

# Reading the mirrored images (mirror.yml) and the code; nothing writes.
permissions:
  contents: read
  packages: read

jobs:
  test:
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    # The database is `ductus dev`'s own Postgres (started after the build, below): every push runs
    # the whole suite on what `dev` ships. DUCTUS_DATABASE_URL comes from there.
    env:
      DUCTUS_TEST_SQLSERVER: sa:Ductus-ci-1@localhost:1433
      # The test SQL Server (scripts/dev/sqlserver.sh): its password, and its folder (its CA).
      MSSQL_SA_PASSWORD: Ductus-ci-1
      DUCTUS_TEST_SQLSERVER_TLS: /home/runner/.local/share/ductus-mssql
    steps:
      - uses: actions/checkout@v7
      # SQL Server 2025 presenting a test CA's certificate (TLS verified, TDS 8 strict): not a
      # service, which can't be given files before it starts. Pulled and started while the rest
      # builds; "Wait for SQL Server" below waits for its logins.
      - name: Start SQL Server
        run: nohup bash scripts/dev/sqlserver.sh start >/tmp/sqlserver.log 2>&1 &
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      # Cache per runner image (ImageOS, e.g. ubuntu24): build outputs from a newer image must never be
      # restored on an older one, or the other way round.
      - run: echo "RUNNER_IMAGE=$ImageOS" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ env.RUNNER_IMAGE }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json

      # First: the engine embeds ui/dist, so clippy and the build need it.
      - name: Web UI (types, lint, format, unit tests, size budget, build)
        working-directory: ui
        run: npm ci --no-audit --no-fund && npm run check && npm run build

      - name: Format
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --release --locked --all-targets -- -D warnings

      - name: Build
        run: cargo build --release --locked

      # `ductus dev`'s Postgres binaries (Maven Central, ~60 MB), kept between runs; a change to
      # dev.rs (its pinned version) fetches them again.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ductus/postgres
          key: ductus-dev-postgres-${{ runner.os }}-${{ hashFiles('crates/ductus-cli/src/dev.rs') }}

      - name: A Postgres (ductus dev --database-only)
        run: |
          mkdir -p "$RUNNER_TEMP/dbproject"
          log="$RUNNER_TEMP/database.log"
          nohup target/release/ductus dev --database-only --root "$RUNNER_TEMP/dbproject" >"$log" 2>&1 &
          url=
          for _ in $(seq 1200); do
            url=$(sed -nE 's#^ +(postgresql://[^ ]+)$#\1#p' "$log")
            [ -n "$url" ] && break
            sleep 0.1
          done
          [ -n "$url" ] || { cat "$log"; exit 1; }
          echo "ready in ${SECONDS}s"
          { echo "DUCTUS_DATABASE_URL=$url"; echo "DUCTUS_TEST_DATABASE_URL=$url"; } >>"$GITHUB_ENV"

      - name: The UI's API types match the API (ui/openapi.json)
        run: |
          target/release/ductus api-spec | diff -u ui/openapi.json - || {
            echo "::error::The API changed: run scripts/dev/check.sh (it updates ui/openapi.json and the UI's types)"; exit 1; }

      # OpenLDAP for the directory sign-in tests and demos (a user-level slapd each: scripts/dev/slapd.sh);
      # from Ubuntu's packages, not Docker Hub. Its system service isn't needed.
      - name: Install slapd
        run: |
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y -qq slapd ldap-utils </dev/null >/dev/null
          sudo systemctl disable --now slapd >/dev/null 2>&1 || true

      # Postgres's server binaries for the TLS tests and demos (a throwaway server each, as this user:
      # scripts/dev/pgtls.sh). The runner image usually has them; otherwise from Ubuntu's packages,
      # without the main cluster (nothing needs one).
      - name: Postgres server binaries
        run: |
          if ! ls /usr/lib/postgresql/*/bin/initdb >/dev/null 2>&1; then
            sudo mkdir -p /etc/postgresql-common/createcluster.d
            echo 'create_main_cluster = false' | sudo tee /etc/postgresql-common/createcluster.d/ductus.conf >/dev/null
            sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y -qq postgresql </dev/null >/dev/null
          fi
          ls -d /usr/lib/postgresql/*/bin

      - name: Wait for SQL Server
        run: |
          while pgrep -f "sqlserver.sh start" >/dev/null; do sleep 1; done
          cat /tmp/sqlserver.log
          bash scripts/dev/sqlserver.sh >/dev/null

      - name: Unit and integration tests
        env:
          DUCTUS_TEST_SLAPD: required
          DUCTUS_TEST_PGTLS: required
        run: cargo test --release --locked

      - name: Example interface tests
        working-directory: examples/adt-relay
        run: ../../target/release/ductus test

      - name: Example validation (types, config, loading)
        working-directory: examples/adt-relay
        run: ../../target/release/ductus validate

      - name: Crash-recovery demo
        run: |
          sudo apt-get install -y -qq postgresql-client >/dev/null
          COUNT=3000 BIN=target/release/ductus bash scripts/demo-crash-recovery.sh | tee demo.log
          grep -q "unique 3000 " demo.log
          grep -q "out of order 0 " demo.log

      - name: Clean stop demo (SIGTERM mid-stream re-sends nothing; with the receiver down it stops at once)
        run: BIN=target/release/ductus bash scripts/demo-stop.sh

      - name: Database lookup demo (async transform, resources, secrets, kill/quarantine)
        run: BIN=target/release/ductus bash scripts/demo-lookup.sh

      - name: HTTP demo (respond mode, queue mode, HTTP destination, formats)
        run: BIN=target/release/ductus bash scripts/demo-http.sh

      - name: Files demo (file, SFTP and schedule sources; split records; kill -9 mid-file)
        run: |
          sudo apt-get install -y -qq openssh-server >/dev/null
          BIN=target/release/ductus bash scripts/demo-files.sh

      - name: v0.4 release demo (REST + DB + fetch, nightly SFTP CSV, dev and prod environments)
        run: BIN=target/release/ductus bash scripts/demo-v04.sh

      - name: Runaway demo (endless loops and heap blow-ups don't stall neighbours)
        run: BIN=target/release/ductus bash scripts/demo-runaway.sh

      - name: Destinations demo (lab down, billing and archive keep going, kill -9, lab catches up)
        run: BIN=target/release/ductus bash scripts/demo-destinations.sh

      - name: Routing demo (one feed routed to three interfaces, kill -9 mid-route, each hop exactly once)
        run: BIN=target/release/ductus bash scripts/demo-routing.sh

      - name: Retention demo (expired partitions dropped, shorter retention confirmed, longer moves)
        run: BIN=target/release/ductus bash scripts/demo-retention.sh

      - name: Held area demo (a receiver cut off for weeks, its backlog held past retention, then delivered)
        run: BIN=target/release/ductus bash scripts/demo-held.sh

      - name: Hotspots demo (one patient's message blocks its worker, a receiver down, a hot patient)
        run: BIN=target/release/ductus bash scripts/demo-hotspots.sh

      - name: Audit demo (a dismissal with its reason, no payload without a log row, a killed engine shows, export)
        run: BIN=target/release/ductus bash scripts/demo-audit.sh

      - name: Alerts demo (a stall mailed to on-call and the owner and posted to chat once, acknowledged and silenced in the audit log, the recovery, the heartbeat)
        run: BIN=target/release/ductus bash scripts/demo-alerts.sh

      - name: Certificates demo (the engine's own check reads a certificate; 20, 10, 3 days and expired are mailed once each; renewed is a recovery)
        run: BIN=target/release/ductus bash scripts/demo-certs.sh

      - name: TLS demo (cert request and show with an openssl CA; gen → TLS listener with client certificates → TLS destination → sink; a renewal mid-stream, nothing failed or duplicated; our certificate's alert; doctor's chain check)
        run: BIN=target/release/ductus bash scripts/demo-tls.sh

      - name: Who may connect demo (allow lists on MLLP, MLLP over TLS and the API; a refused address is closed before the handshake, logged once a minute; validate, ports, /ports, doctor; TCP keepalive)
        run: BIN=target/release/ductus bash scripts/demo-allow.sh

      - name: Directory demo (OpenLDAP sign-in with groups and nested groups, refusals alike, the directory's certificate, a group removal ends the session at the refresh, the directory down and the local break-glass admin)
        run: BIN=target/release/ductus bash scripts/demo-ldap.sh

      - name: Dev demo (ductus dev starts a Postgres of its own; same port and data on restart; a killed one is cleaned up)
        run: BIN=target/release/ductus bash scripts/demo-dev.sh

      - name: One-owner demo (a second engine with the same interfaces refused, another project alongside, the lock lost and taken back, kill -9 then a start at once, lowered lanes with a backlog refused)
        run: BIN=target/release/ductus bash scripts/demo-one-owner.sh

      - name: Web UI demo (a real browser against the engine; sign-in, attention, messages, axe in every theme)
        run: |
          (cd ui && npx playwright install --with-deps chromium >/dev/null)
          BIN=target/release/ductus bash scripts/demo-ui.sh

      - name: v0.5 release demo (one on-call night in the browser - directory sign-in, a stall diagnosed and mailed to the owner, pause with a note, recovery mail, replay/edit/dismiss, the audit log, a 7-day certificate)
        run: BIN=target/release/ductus bash scripts/demo-v05.sh

      - name: Web UI report (on failure)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ui-report
          path: |
            ui/playwright-report
            ui/test-results
          if-no-files-found: ignore

      - name: Scale demo (300 shared interfaces + 1 dedicated, hot MRN)
        run: SHARED=300 EPIC_SECONDS=10 SAMPLED=50 BIN=target/release/ductus bash scripts/demo-scale.sh

  # The container image and the Linux packages, from the Dockerfile (one engine build, on Rocky
  # Linux 9, for both), tested end to end. In parallel with `test`; nothing is published.
  packaging:
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7

      - name: Sign in to ghcr.io (the mirrored Postgres image)
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Image (build; compose with Postgres; docker compose stop mid-stream re-sends nothing)
        run: bash scripts/demo-docker.sh

      - name: Linux packages (systemd in containers; install, upgrade under traffic, stop, remove; Ubuntu and Rocky)
        run: bash scripts/demo-packages.sh

  # The Rust tests on Windows (paths, line endings, sockets and file renames behave differently
  # there), on `ductus dev`'s Postgres, in parallel with the others, and SQL Server's Windows logins
  # against SQL Server Express (DUCTUS_TEST_SQLSERVER_WINDOWS=required). Skipped here, each with its
  # note: the tests that need bash helpers (the TLS Postgres, slapd), the SQL Server-on-Linux tests,
  # and the `allow` tests that send from 127.0.0.2 (Linux only).
  windows-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      # Shared with `windows`, saved here: this job's build covers that one's. The cold build is
      # long: keep it when a test fails.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows
          cache-on-failure: true
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json

      # SQL Server Express with Windows logins (scripts/dev/sqlexpress.ps1), installed in the
      # background while the tests build (~3 min; the build takes longer). Windows PowerShell, not
      # pwsh: the script uses System.Data.SqlClient and the LocalAccounts module. In a window of its
      # own, writing its own log: started with -NoNewWindow it shared this step's console, which
      # closes when the step ends, and choco's install stalled there.
      - name: SQL Server Express, in the background (Windows logins)
        shell: pwsh
        run: |
          $pw = "Dx-" + [guid]::NewGuid()
          "::add-mask::$pw"
          "DUCTUS_TEST_SQLSERVER_WINDOWS_PASSWORD=$pw" >> $env:GITHUB_ENV
          $log = Join-Path $env:RUNNER_TEMP "sqlexpress.log"
          $done = Join-Path $env:RUNNER_TEMP "sqlexpress.done"
          $script = (Resolve-Path scripts/dev/sqlexpress.ps1).Path
          Start-Process powershell -WindowStyle Hidden -ArgumentList "-NoProfile -ExecutionPolicy Bypass -Command & { & '$script' -Password '$pw' -Install -Done '$done' *> '$log' }"

      - name: Web UI (the binary embeds it)
        working-directory: ui
        run: npm ci --no-audit --no-fund && npm run build

      - name: Build the tests
        run: cargo test --release --locked --no-run

      - uses: actions/cache@v6
        with:
          path: ~\AppData\Local\ductus\postgres
          key: ductus-dev-postgres-${{ runner.os }}-${{ hashFiles('crates/ductus-cli/src/dev.rs') }}

      - name: A Postgres (ductus dev --database-only)
        shell: pwsh
        run: |
          $sw = [Diagnostics.Stopwatch]::StartNew()
          $project = Join-Path $env:RUNNER_TEMP "dbproject"
          New-Item -ItemType Directory $project | Out-Null
          $log = Join-Path $env:RUNNER_TEMP "database.log"
          Start-Process target/release/ductus.exe -ArgumentList "dev --database-only --root `"$project`"" -NoNewWindow -RedirectStandardOutput $log -RedirectStandardError "$log.err"
          $url = $null
          for ($i = 0; $i -lt 1200 -and -not $url; $i++) {
            Start-Sleep -Milliseconds 100
            $url = (Get-Content $log -ErrorAction SilentlyContinue | Where-Object { $_ -match '^\s+(postgresql://\S+)$' } | Select-Object -First 1)
          }
          if (-not $url) { Get-Content $log, "$log.err" -ErrorAction SilentlyContinue; throw "no database" }
          "ready in $($sw.Elapsed)"
          "DUCTUS_DATABASE_URL=$($url.Trim())" >> $env:GITHUB_ENV
          "DUCTUS_TEST_DATABASE_URL=$($url.Trim())" >> $env:GITHUB_ENV

      - name: SQL Server Express ready
        shell: pwsh
        run: |
          $sw = [Diagnostics.Stopwatch]::StartNew()
          $done = Join-Path $env:RUNNER_TEMP "sqlexpress.done"
          $log = Join-Path $env:RUNNER_TEMP "sqlexpress.log"
          while (-not (Test-Path $done) -and $sw.Elapsed.TotalMinutes -lt 15) { Start-Sleep 2 }
          Get-Content $log -ErrorAction SilentlyContinue
          "waited $($sw.Elapsed) for it after the build"
          $result = Get-Content $done -ErrorAction SilentlyContinue
          if ($result -ne "ready") { throw "SQL Server Express: $result" }
          "DUCTUS_TEST_SQLSERVER_WINDOWS=required" >> $env:GITHUB_ENV

      - name: Unit and integration tests
        run: cargo test --release --locked

      - name: Windows login time vs a SQL login (measured, not judged)
        run: cargo test --release --locked -p ductus-runtime --lib time_a_windows_login -- --ignored --nocapture

  # The Windows build, installer and service, in parallel with the others.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      # One Windows cache for both Windows jobs, saved by `windows-tests` (its build covers this one's).
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows
          save-if: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Web UI (the binary embeds it)
        working-directory: ui
        run: npm ci --no-audit --no-fund && npm run build

      - name: Build
        run: cargo build --release --locked -p ductus

      - name: Installer (WiX)
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add --global WixToolset.Util.wixext/5.0.2
          ./packaging/windows/build.ps1 -Binary target/release/ductus.exe -Version 0.5.0-ci -Out dist

      - name: A Postgres for the service (ductus dev --database-only)
        shell: pwsh
        run: |
          $project = Join-Path $env:RUNNER_TEMP "dbproject"
          New-Item -ItemType Directory $project | Out-Null
          $log = Join-Path $env:RUNNER_TEMP "database.log"
          Start-Process target/release/ductus.exe -ArgumentList "dev --database-only --root `"$project`"" -NoNewWindow -RedirectStandardOutput $log -RedirectStandardError "$log.err"
          $url = $null
          for ($i = 0; $i -lt 240 -and -not $url; $i++) {
            Start-Sleep 1
            $url = (Get-Content $log -ErrorAction SilentlyContinue | Where-Object { $_ -match '^\s+(postgresql://\S+)$' } | Select-Object -First 1)
          }
          if (-not $url) { Get-Content $log, "$log.err" -ErrorAction SilentlyContinue; throw "no database" }
          "DEMO_DATABASE_URL=$($url.Trim())" >> $env:GITHUB_ENV

      - name: Installer demo (silent install, service, MLLP round trip, upgrade over it, uninstall)
        shell: pwsh
        run: ./scripts/demo-windows.ps1 -Msi (Get-Item dist/*.msi).FullName -DatabaseUrl $env:DEMO_DATABASE_URL -LogDir "$env:RUNNER_TEMP/demo-logs"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-installer
          path: |
            dist/*.msi
            ${{ runner.temp }}/demo-logs
          if-no-files-found: ignore
