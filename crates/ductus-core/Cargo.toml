[package]
name = "ductus-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow = "1.0.104"
argon2 = { version = "0.5.3", default-features = false, features = ["alloc", "password-hash"] }
base64 = "0.23.1"
chrono = "0.4.45"
croner = "4.0.1"
chacha20poly1305 = "0.11.0"
getrandom = "0.4.3"
# Where a key is in a YAML file (line and column), for `ductus validate --json`: serde_yaml_ng's
# values carry no positions.
saphyr-parser = "0.3.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# Which setting a deserialization error is about (`destination.mllp.port`): already in the binary
# through axum.
serde_path_to_error = "0.1.20"
serde_yaml_ng = "0.10.0"
url = "2.5.8"

[dev-dependencies]
# The configuration files' JSON Schemas are made from the config types by a test (`schema.rs`): the
# binary carries the committed text, never schemars.
jsonschema = { version = "0.60.2", default-features = false }
schemars = "1.2.3"
tempfile = "3.27.0"
