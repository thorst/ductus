[package]
name = "ductus-store"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
getrandom = "0.4.3"
serde_json = "1.0.151"
sha2 = "0.10.9"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "chrono", "migrate", "macros"] }
tokio = { version = "1.53.2", features = ["time"] }
tracing = "0.1.44"

[features]
# Helpers for tests (deleting the accounts they made): never in the binary.
testing = ["tokio/rt"]

[dev-dependencies]
# The store's own tests use its `testing` helpers.
ductus-store = { path = ".", features = ["testing"] }
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread"] }
