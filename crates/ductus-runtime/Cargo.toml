[package]
name = "ductus-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
bytes = "1.12.1"
chrono = { version = "0.4.45", features = ["serde"] }
csv = "1.4.0"
ductus-core = { version = "0.5.0-dev", path = "../ductus-core" }
ductus-hl7 = { version = "0.5.0-dev", path = "../ductus-hl7" }
ductus-mllp = { version = "0.5.0-dev", path = "../ductus-mllp" }
ductus-script = { version = "0.5.0-dev", path = "../ductus-script" }
ductus-store = { version = "0.5.0-dev", path = "../ductus-store" }
futures-util = "0.3"
ldap3 = { version = "0.12.1", default-features = false, features = ["tls-rustls-aws-lc-rs"] }
rcgen = { version = "0.14.10", default-features = false, features = ["aws_lc_rs", "crypto", "pem"] }
lettre = { version = "0.11.23", default-features = false, features = ["smtp-transport", "pool", "builder", "hostname", "tokio1", "tokio1-rustls", "rustls-platform-verifier", "aws-lc-rs"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2"] }
# prefer-post-quantum (rustls's own default): the hybrid X25519MLKEM768 key exchange first, for
# every TLS connection in the binary (features unify); peers without it fall back at no extra cost.
rustls = { version = "0.23.45", default-features = false, features = ["aws_lc_rs", "std", "tls12", "prefer-post-quantum"] }
rustls-native-certs = "0.8.4"
rustls-platform-verifier = "0.7.1"
# Already in the tree through rustls: its errors, read for plain words (`tls::outbound_failure`).
rustls-webpki = { version = "0.103.15", default-features = false }
russh = "0.64.1"
russh-sftp = "3.0.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
# Already in the tree through tokio: TCP keepalive on accepted connections (`allow::keepalive`).
socket2 = "0.6.5"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "json", "tls-rustls-aws-lc-rs"] }
tiberius = { version = "0.13.0", default-features = false, features = ["tds80", "rustls", "chrono", "sql-browser-tokio"] }
tokio = { version = "1.53.2", features = ["full"] }
tokio-util = { version = "0.7", features = ["compat"] }
tokio-rustls = "0.26.6"
tracing = "0.1.44"
url = "2.5.8"
utoipa = { version = "6.0.0", features = ["chrono"] }
utoipa-axum = "0.3.0"
x509-parser = "0.18.1"

[build-dependencies]
flate2 = "1.1.10"

[dev-dependencies]
# Its `testing` helpers: the throwaway TLS Postgres (`PgTls`).
ductus-store = { version = "0.5.0-dev", path = "../ductus-store", features = ["testing"] }
serde_yaml_ng = "0.10.0"
tempfile = "3.27.0"
