[package]
name = "ductus-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
bytes = "1.12.1"
chrono = { version = "0.4.45", features = ["serde"] }
csv = "1.4.0"
ductus-core = { version = "0.1.0-dev", path = "../ductus-core" }
ductus-hl7 = { version = "0.1.0-dev", path = "../ductus-hl7" }
ductus-mllp = { version = "0.1.0-dev", path = "../ductus-mllp" }
ductus-script = { version = "0.1.0-dev", path = "../ductus-script" }
ductus-store = { version = "0.1.0-dev", path = "../ductus-store" }
futures-util = "0.3"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2"] }
rustls = { version = "0.23.45", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
rustls-platform-verifier = "0.7.1"
russh = "0.64.1"
russh-sftp = "3.0.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "json"] }
tiberius = { version = "0.13.0", default-features = false, features = ["tds80", "rustls", "chrono", "sql-browser-tokio"] }
tokio = { version = "1.53.2", features = ["full"] }
tokio-util = { version = "0.7", features = ["compat"] }
tokio-rustls = "0.26.6"
tracing = "0.1.44"
url = "2.5.8"
utoipa = { version = "6.0.0", features = ["chrono"] }
utoipa-axum = "0.3.0"
x509-parser = "0.18.1"

[build-dependencies]
flate2 = "1.1.10"

[dev-dependencies]
rcgen = { version = "0.14.10", default-features = false, features = ["aws_lc_rs", "crypto"] }
serde_yaml_ng = "0.10.0"
tempfile = "3.27.0"
