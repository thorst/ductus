[package]
name = "ductus-mllp"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
bytes = "1.12.1"
tokio = { version = "1.53.2", features = ["net", "io-util", "time", "rt", "macros"] }
tokio-util = "0.7"
tracing = "0.1.44"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Networking_WinSock", "Win32_System_IO"] }
