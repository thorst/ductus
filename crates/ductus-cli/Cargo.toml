[package]
name = "ductus"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
bytes = "1.12.1"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive", "env"] }
ductus-core = { version = "0.5.0-dev", path = "../ductus-core" }
ductus-hl7 = { version = "0.5.0-dev", path = "../ductus-hl7" }
ductus-mllp = { version = "0.5.0-dev", path = "../ductus-mllp" }
ductus-runtime = { version = "0.5.0-dev", path = "../ductus-runtime" }
ductus-script = { version = "0.5.0-dev", path = "../ductus-script" }
ductus-store = { version = "0.5.0-dev", path = "../ductus-store" }
rpassword = "7.4.0"
postgresql_embedded = { version = "0.21.0", default-features = false, features = ["zonky", "tls-rustls-aws-lc-rs"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json"] }
serde_json = "1.0.151"
tokio = { version = "1.53.2", features = ["full"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[target.'cfg(windows)'.dependencies]
tracing = "0.1.44"
tracing-appender = "0.2.3"
windows-service = "0.8.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2.190"

[dev-dependencies]
tempfile = "3.27.0"
