[package]
name = "ductus"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow = "1.0.104"
bytes = "1.12.1"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive", "env"] }
ductus-core = { version = "0.1.0-dev", path = "../ductus-core" }
ductus-hl7 = { version = "0.1.0-dev", path = "../ductus-hl7" }
ductus-mllp = { version = "0.1.0-dev", path = "../ductus-mllp" }
ductus-runtime = { version = "0.1.0-dev", path = "../ductus-runtime" }
ductus-script = { version = "0.1.0-dev", path = "../ductus-script" }
ductus-store = { version = "0.1.0-dev", path = "../ductus-store" }
serde_json = "1.0.151"
tokio = { version = "1.53.2", features = ["full"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3.27.0"
