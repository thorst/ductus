name: adt-in
source:
  mllp: { port: 6661 }
script: transform.ts
ordering:
  key: PID-3.1      # messages for the same MRN stay in order
  partitions: 64
isolation: dedicated   # a busy feed: own threads, 4 parallel MRN lanes
workers: 4
dedupe:
  keys: [MSH-10]    # a sender resending after a lost ACK is recognized
  window: 24h
destination:
  mllp: { host: 127.0.0.1, port: 6662 }   # waits for AA; AE retries, AR quarantines
