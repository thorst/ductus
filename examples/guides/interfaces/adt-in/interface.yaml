name: adt-in
about:
  description: ADT from the EHR, to the lab system and to billing
  owner: integration-team
  from: { application: EHR, vendor: Epic }
source: { mllp: { port: 6661 } }
ordering: { key: PID-3.1 }          # one patient's messages stay in order
dedupe: { keys: [MSH-10], window: 24h }
destinations:
  lab:
    mllp: { host: ${LAB_HOST}, port: ${LAB_PORT} }
    script: lab.ts                  # each destination's code in a file of its own
    application: Lab system
  billing:
    interface: adt-to-billing       # a route: into that interface's queue
    script: billing.ts
